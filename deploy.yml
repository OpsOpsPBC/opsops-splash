name: Deploy Static Site

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.repository.name }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  KEEP_RELEASES: 5
  TARGET_ENV: ${{ github.ref_name == 'main' && 'live' || 'staging' }}
  DEPLOY_PATH: /var/www/${{ github.event.repository.name }}/${{ github.ref_name == 'main' && 'live' || 'staging' }}
  # Set BUILD_DIR to match your build tool output:
  # - '.' for plain HTML/CSS/JS in repo root
  # - 'dist' for Vite / Astro / Vue
  # - 'build' for React (Create React App)
  # - 'out' for Next.js static export
  # - 'public' for Hugo
  BUILD_DIR: 'dist'

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || (hashFiles('yarn.lock') != '' && 'yarn' || (hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '')) }}

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Install dependencies (fallback)
        if: hashFiles('package.json') != '' && hashFiles('package-lock.json') == '' && hashFiles('yarn.lock') == '' && hashFiles('pnpm-lock.yaml') == ''
        run: npm install

      - name: Build site
        if: hashFiles('package.json') != ''
        run: npm run build --if-present

      - name: Create deployment archive
        run: |
          if [ ! -d "${{ env.BUILD_DIR }}" ]; then
            echo "::error::BUILD_DIR '${{ env.BUILD_DIR }}' does not exist. Check your build output configuration."
            exit 1
          fi

          tar -czf /tmp/deploy.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='tests' \
            -C "${{ env.BUILD_DIR }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: /tmp/deploy.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'live' || 'staging' }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'live' || 'staging' }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: /tmp

      - name: Verify required secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -z "$SSH_HOST" ]        && missing+=("SSH_HOST")
          [ -z "$SSH_USER" ]        && missing+=("SSH_USER")
          [ -z "$SSH_PRIVATE_KEY" ] && missing+=("SSH_PRIVATE_KEY")
          [ -z "$SSH_KNOWN_HOSTS" ] && missing+=("SSH_KNOWN_HOSTS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config << EOF
          Host deploy-target
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ControlMaster auto
            ControlPath ~/.ssh/cm-%r@%h:%p
            ControlPersist 10m
            ServerAliveInterval 30
            ConnectTimeout 15
            ConnectionAttempts 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Test SSH connectivity
        run: |
          for i in 1 2 3 4 5; do
            if ssh deploy-target 'echo "SSH OK on $(hostname)"'; then
              exit 0
            fi
            echo "Attempt $i failed, sleeping $((i * 5))s..."
            sleep $((i * 5))
          done
          echo "::error::Could not establish SSH connection after 5 attempts"
          exit 1

      - name: Copy bundle to server
        env:
          REMOTE_TARBALL: /tmp/deploy-${{ github.event.repository.name }}-${{ env.TARGET_ENV }}-${{ github.run_id }}.tar.gz
        run: |
          for i in 1 2 3; do
            if scp /tmp/deploy.tar.gz "deploy-target:$REMOTE_TARBALL"; then
              exit 0
            fi
            echo "scp attempt $i failed, sleeping $((i * 5))s..."
            sleep $((i * 5))
          done
          echo "::error::scp failed after 3 attempts"
          exit 1

      - name: Deploy on server
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          KEEP_RELEASES: ${{ env.KEEP_RELEASES }}
          REMOTE_TARBALL: /tmp/deploy-${{ github.event.repository.name }}-${{ env.TARGET_ENV }}-${{ github.run_id }}.tar.gz
        run: |
          ssh deploy-target \
            DEPLOY_PATH="$DEPLOY_PATH" \
            KEEP_RELEASES="$KEEP_RELEASES" \
            REMOTE_TARBALL="$REMOTE_TARBALL" \
            'bash -se' << 'EOF'
            set -euo pipefail
            trap 'rm -f "$REMOTE_TARBALL"' EXIT

            TIMESTAMP="$(date +%Y%m%d%H%M%S)"
            RELEASE="${DEPLOY_PATH}/releases/${TIMESTAMP}"
            CURRENT="${DEPLOY_PATH}/current"

            mkdir -p "$RELEASE"
            echo "==> Extracting release: $RELEASE"
            tar -xzf "$REMOTE_TARBALL" -C "$RELEASE"

            PREVIOUS=""
            if [ -L "$CURRENT" ]; then
              PREVIOUS="$(readlink -f "$CURRENT")"
            fi

            echo "==> Switching symlink"
            ln -sfn "$RELEASE" "$CURRENT"

            echo "==> Pruning old releases (keeping ${KEEP_RELEASES})"
            ls -1dt "${DEPLOY_PATH}/releases"/*/ 2>/dev/null \
              | tail -n +$((KEEP_RELEASES + 1)) \
              | while read -r OLD; do
                  echo "  Pruning release: $OLD"
                  chmod -R u+w "$OLD" 2>/dev/null || true
                  rm -rf "$OLD"
                done

            echo "==> Deploy complete: $TIMESTAMP"
          EOF

      - name: Health check
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL not set, skipping"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL")
            if [ "$code" = "200" ]; then
              echo "Health check passed (HTTP $code)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code, retrying..."
            sleep 5
          done
          echo "::error::Health check failed"
          exit 1

      - name: Close SSH ControlMaster
        if: always()
        run: ssh -O exit deploy-target 2>/dev/null || true
